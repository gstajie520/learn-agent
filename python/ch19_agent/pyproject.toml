[project]
name = "agent-tutorial-ch19"
version = "0.1.0"
description = "第 19 章 MCP 动态工具池与多服务器隔离的 Python 迁移版"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.0.0",
  "python-dotenv>=1.0.0",
  "pyyaml>=6.0.0",
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.6.0", "mypy>=1.10.0", "types-PyYAML>=6.0.0"]

[project.scripts]
agent-ch19 = "agent_ch19.cli:main"

[tool.setuptools.packages.find]
include = ["agent_ch19*"]
exclude = ["skills*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
